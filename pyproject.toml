[project]
name = "coi-formularze"
version = "0.1.0"
description = "AI form digitization service: turns paper form blanks into e-form JSON configs"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "odfpy>=1.4.1",
    "openpyxl>=3.1.5",
    "pdfplumber>=0.11.11",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.34",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
