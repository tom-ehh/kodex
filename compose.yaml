services:
  api:
    build: .
    image: kodex:0.1.0
    ports:
      - "8000:8000"
    # Secrets come in at runtime only; .env is excluded from the image by .dockerignore.
    env_file:
      - path: .env
        required: false
    environment:
      COI_ROUTER_ENABLED: "true"
      COI_ROUTER_URL: http://router:8000
      COI_MORPHEUS_ENABLED: "true"
    read_only: true
    tmpfs:
      - /tmp  # Starlette spools large uploads here; wiped with the container
    volumes:
      - morpheus-data:/data  # Morpheus skill store (SQLite); the only writable path
    restart: unless-stopped
    # No depends_on: the API answers at once and routes heuristically until the router is ready.

  router:
    build: docker/basal
    image: kodex-router:0.1.0
    # Internal only: the API reaches it as http://router:8000.
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - hf-cache:/home/app/.cache/huggingface  # weights survive rebuilds and restarts
    restart: unless-stopped

volumes:
  hf-cache:
  morpheus-data:
